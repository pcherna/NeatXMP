[project]
name = "neatxmp"
version = "0.1.0"
description = "Create or update XMP sidecar files from folder/file name dates"
requires-python = ">=3.11"
dependencies = [
    "dearpygui>=1.9.0",
    "lxml>=5.0.0",
]

[project.scripts]
neatxmp = "neatxmp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neatxmp"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
